# VAKIFNAME test ortamı: calismalar.tikirsoft.com (Cloudflare → bu sunucu). Site 127.0.0.1:4180 (app.web), API 127.0.0.1:8120.
# Sunucuda /root/calismalar/nginx.conf; /etc/nginx/sites-enabled/calismalar.tikirsoft.com buna bağlantıdır.
server {
    listen 80;
    listen [::]:80;
    server_name calismalar.tikirsoft.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name calismalar.tikirsoft.com;
    ssl_certificate     /etc/ssl/tikir/origin-wildcard.pem;
    ssl_certificate_key /etc/ssl/tikir/origin-wildcard.key;
    # Kaynak PDF yükleme (Cloudflare ücretsiz planı da 100 MB'ta keser).
    client_max_body_size 100m;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    # Test ortamı: arama motorlarına kapalı.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Linkle paylaşılan videolar: sitede bağlantısı yok, adres rastgele klasör adıyla tahmin edilemez.
    # Dosyalar /var/www/vakifname-paylasim/<rastgele>/ altında; aynı adla değiştirilince link aynı kalır.
    location ^~ /v/ {
        alias /var/www/vakifname-paylasim/;
        autoindex off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8120/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
